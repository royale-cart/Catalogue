<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royale Cart | Elite Dynamic Showcase</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <link rel="stylesheet" href="style.css?v=5.0">
</head>
<body>

    <div class="scroll-progress" id="scrollProgress"></div>
    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-outline" id="cursorOutline"></div>

    <div id="loader">
        <div class="loader-content">
            <div class="loader-icon"><i class="ph ph-shopping-cart-fill"></i></div>
            <div class="loader-text">Royale Cart</div>
            <div class="loader-wave-container">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
            </div>
        </div>
    </div>

    <header id="header">
        <div class="logo">
            <i class="ph ph-shopping-cart-fill"></i> Royale Cart
        </div>
        <div class="controls">
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme">
                <i class="ph ph-sun"></i>
            </button>
        </div>
    </header>

    <section class="filters-section">
        <div class="search-box">
            <i class="ph ph-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search premium catalog..." autocomplete="off">
        </div>
        
        <div class="category-segmented-control" id="categoryContainer">
            </div>
    </section>

    <main>
        <div class="grid" id="productGrid">
            </div>
        <div class="empty-state" id="emptyState">
            <i class="ph ph-ghost"></i>
            <h2>No products found</h2>
            <p>Try adjusting your search or filters.</p>
        </div>
    </main>

    <footer class="minimal-footer">
        <p>&copy; 2026 Royale Cart. All rights reserved.</p>
        <div class="footer-glow"></div>
    </footer>

    <div class="modal-overlay" id="productModal">
        <div class="modal-box">
            <div class="modal-image-wrapper">
                <img id="modalProductImage" src="" alt="Product">
            </div>
            
            <h3 class="modal-title" id="modalProductName">Product Name</h3>
            <p class="modal-desc">Order directly from store or request details.</p>
            
            <div class="modal-actions-container">
                <div class="modal-actions-row">
                    <a href="https://royale-cart.vercel.app/" target="_blank" class="btn-order">Order Now</a>
                    <button class="btn-cancel" id="cancelModalBtn">Cancel</button>
                </div>
                <a href="#" target="_blank" class="btn-wa-bar" id="waModalBtn">WhatsApp</a>
            </div>
        </div>
    </div>

    <a href="https://wa.me/923439888674" target="_blank" class="floating-wa" aria-label="Contact on WhatsApp">
        <i class="ph ph-whatsapp-logo"></i>
    </a>
    <button class="back-to-top" id="backToTop" aria-label="Back to Top">
        <i class="ph ph-arrow-up"></i>
    </button>

    <script src="script.js?v=5.0" defer></script>
</body>
</html>
